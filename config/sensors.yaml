# Sensor Configuration for SMEAR Estonia CO2 Dataset
# =================================================
#
# Directory structure (per-sensor outputs):
#   output/sensors/{sensor_name}/csv/      - CSV files
#   output/sensors/{sensor_name}/parquet/  - Parquet files
#   output/sensors/{sensor_name}/plots/    - Visualisations
#   output/merged/csv/                     - Merged CSVs
#   output/merged/parquet/                 - Merged parquets
#   output/logs/                           - Processing logs
#   output/validation/                     - Validation receipts

sensors:
  - name: CO2_SCT1_2M
    sensor_type: scd41
    sensor_id: null
    input_dir: /home/mbz/Documents/PhD/SCD41_DATA/testing/IOT/CO2-SCT1-2M
    altitude_m: 2
    expected_interval: 60
    co2_range: [0, 5000]
    temp_range: [-40, 70]
    humidity_range: [0, 100]

  - name: CO2_30M_A
    sensor_type: scd41
    sensor_id: A
    input_dir: /home/mbz/Documents/PhD/SCD41_DATA/testing/IOT/CO2-30M/CO2-30M
    altitude_m: 30
    expected_interval: 60
    co2_range: [0, 5000]
    temp_range: [-40, 70]
    humidity_range: [0, 100]

  - name: CO2_30M_B
    sensor_type: scd41
    sensor_id: B
    input_dir: /home/mbz/Documents/PhD/SCD41_DATA/testing/IOT/CO2-30M/CO2-30M
    altitude_m: 30
    expected_interval: 60
    co2_range: [0, 5000]
    temp_range: [-40, 70]
    humidity_range: [0, 100]

  - name: CO2_30M_C
    sensor_type: scd41
    sensor_id: C
    input_dir: /home/mbz/Documents/PhD/SCD41_DATA/testing/IOT/CO2-30M/CO2-30M
    altitude_m: 30
    expected_interval: 60
    co2_range: [0, 5000]
    temp_range: [-40, 70]
    humidity_range: [0, 100]

  - name: LGR_30M
    sensor_type: lgr_csv
    sensor_id: null
    input_dir: /home/mbz/Documents/PhD/SCD41_DATA/testing/IOT/GASES/co2ch4
    altitude_m: 30
    expected_interval: 1
    co2_range: [0, 20000]
    temp_range: null
    humidity_range: null

# Excluded sensors (log but skip processing)
excluded_sensor_ids: ['D']

# Output directories (new per-sensor structure)
sensors_dir: output/sensors           # Per-sensor outputs (csv/, parquet/, plots/)
merged_dir: output/merged             # Merged outputs (csv/, parquet/)
log_dir: output/logs                  # Processing logs
validation_dir: output/validation     # validation receipt directory