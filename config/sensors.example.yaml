# Sensor Configuration
sensors:
  - name: CO2_SCT1_2M
    sensor_type: scd41
    sensor_id: null
    input_dir: path.../to/CO2-SCT1
    altitude_m: 2
    expected_interval: 60
    co2_range: [0, 5000]
    temp_range: [-40, 70]
    humidity_range: [0, 100]

  - name: CO2_30M_A
    sensor_type: scd41
    sensor_id: A
    input_dir: path.../to/CO2-30M
    altitude_m: 30
    expected_interval: 60
    co2_range: [0, 5000]
    temp_range: [-40, 70]
    humidity_range: [0, 100]

  - name: CO2_30M_B
    sensor_type: scd41
    sensor_id: B
    input_dir: path.../to/CO2-30M
    altitude_m: 30
    expected_interval: 60
    co2_range: [0, 5000]
    temp_range: [-40, 70]
    humidity_range: [0, 100]

  - name: CO2_30M_C
    sensor_type: scd41
    sensor_id: C
    input_dir: path.../to/CO2-30M
    altitude_m: 30
    expected_interval: 60
    co2_range: [0, 5000]
    temp_range: [-40, 70]
    humidity_range: [0, 100]

  - name: LGR_30M
    sensor_type: lgr_csv
    sensor_id: null
    input_dir: path_to_/IOT/GASES/co2ch4
    altitude_m: 30
    expected_interval: 1
    co2_range: [0, 20000]
    temp_range: null
    humidity_range: null

# Excluded sensors (log but skip processing)
excluded_sensor_ids: ['D']

# Output directories
output_dir: output/individual
parquet_dir: output/parquet
log_dir: output/logs