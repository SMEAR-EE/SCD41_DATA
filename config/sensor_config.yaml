# Sensor Configuration for SMEAR Estonia CO2 Dataset
# =================================================
#
# Directory structure (per-sensor outputs):
#   output/sensors/{sensor_name}/csv/      - CSV files
#   output/sensors/{sensor_name}/parquet/  - Parquet files
#   output/sensors/{sensor_name}/plots/    - Visualisations
#   output/merged/csv/                     - Merged CSVs
#   output/merged/parquet/                 - Merged parquets
#   output/merged/plots/                   - Merged plots
#   output/logs/                           - Processing logs
#   output/validation/                     - Validation receipts

sensors:
  - name: CO2_SCT1_2M
    sensor_type: scd41
    sensor_id: null
    input_dir: #path to IOT/CO2-SCT1-2M
    altitude_m: 2
    expected_interval: 60
    co2_range: [300, 1000] # rare to exceed ~600 ppm; 1k+ anomalous @30m AGL
    temp_range: [-10, 60]
    humidity_range: [0, 100]

  - name: CO2_30M_A
    sensor_type: scd41
    sensor_id: A
    input_dir: #path to IOT/CO2-30M/CO2-30M
    altitude_m: 30
    expected_interval: 60
    co2_range: [300, 1000]
    temp_range: [-10, 60]
    humidity_range: [0, 100]

  - name: CO2_30M_B
    sensor_type: scd41
    sensor_id: B
    input_dir: #path to IOT/CO2-30M/CO2-30M
    altitude_m: 30
    expected_interval: 60
    co2_range: [300, 1000]
    temp_range: [-10, 60]
    humidity_range: [0, 100]

  - name: CO2_30M_C
    sensor_type: scd41
    sensor_id: C
    input_dir: #path to IOT/CO2-30M/CO2-30M
    altitude_m: 30
    expected_interval: 60
    co2_range: [300, 1000]
    temp_range: [-10, 60]
    humidity_range: [0, 100]

  - name: LGR_30M
    sensor_type: lgr_csv
    sensor_id: null
    input_dir: #path to IOT/GASES/co2ch4
    altitude_m: 30
    expected_interval: 120       # LGR sample rate ~117s
    co2_range: [350, 600]        # actual range in datasheet: [0, 20000] 
    temp_range: [5, 45]          # operating temp from datasheet: https://envicontrol.com/storage/app/media/uploaded-files/UGGA%20LGR%20GLA132-GGA.pdf
    humidity_range: null         # H2O is in ppm not %RH, different column semantics

# Excluded sensors (log but skip processing)
excluded_sensor_ids: ['D']

# Output directories (new per-sensor structure)
sensors_dir: output/sensors           # Per-sensor outputs (csv/, parquet/, plots/)
merged_dir: output/merged             # Merged outputs (csv/, parquet/, plots/)
log_dir: output/logs                  # Processing logs
validation_dir: output/validation     # validation receipt directory