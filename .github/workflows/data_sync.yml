name: SMEAR Data Sync

on:
  schedule:
    - cron: "0 0 1,15 * *" # Runs on the 1st and 15th of each month at midnight
  workflow_dispatch:

jobs:
  fetch_and_update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
