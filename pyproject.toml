[project]
name = "SCD41_DATA"
version = "0.1.0"
description = "Fast, reproducible preprocessing pipeline for SCD41 and LGR CO₂ sensor data."
authors = [
    { name = "Matevz B. Zorec"}
]
requires-python = ">=3.10"

# Only include runtime dependencies.
# Dev dependencies stay in requirements-dev.txt or your notebook environment.
dependencies = [
    "pandas>=2.3",
    "numpy>=2.0",
    "pyarrow>=15.0",
    "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Optional: CLI entrypoint (enable when you add cli.py)
# [project.scripts]
# scd41-preprocess = "scd41_data.cli:main"
