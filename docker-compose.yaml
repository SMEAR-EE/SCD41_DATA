version: "3.9"

services:
  smear-co2:
    build: .
    container_name: smear_co2_processor

    volumes:
      - ./config:/app/config:ro    # Load user config
      - ./output:/app/output       # Save outputs
      - /absolute/path/SCD41:/data/scd41:ro
      - /absolute/path/LGR:/data/lgr:ro

    environment:
      PYTHONUNBUFFERED: "1"

    tty: true
